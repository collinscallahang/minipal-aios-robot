<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=./simulation/" />
    <title>MiniPal 仿真平台</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #edf2f5;
        color: #18212f;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(520px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid #d6e1eb;
        background: #f8fbff;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0 0 18px;
        color: #637083;
        line-height: 1.7;
      }

      a {
        display: inline-block;
        padding: 11px 14px;
        background: #2d75b9;
        color: white;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MiniPal 仿真平台</h1>
      <p>正在跳转到可交互仿真控制台。如果浏览器没有自动跳转，请点击下面的入口。</p>
      <a href="./simulation/">打开仿真控制台</a>
    </main>
    <script>
      window.location.replace("./simulation/");
    </script>
  </body>
</html>
