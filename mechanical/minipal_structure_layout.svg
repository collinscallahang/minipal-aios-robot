<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <style>
    .title { font: 700 28px sans-serif; fill: #1f2937; }
    .label { font: 600 18px sans-serif; fill: #1f2937; }
    .note { font: 16px sans-serif; fill: #374151; }
    .dim { font: 16px sans-serif; fill: #0f766e; }
    .outline { fill: #f8fafc; stroke: #334155; stroke-width: 3; }
    .module { stroke: #334155; stroke-width: 2; rx: 10; ry: 10; }
    .servo { fill: #f59e0b; }
    .board { fill: #60a5fa; }
    .battery { fill: #34d399; }
    .sensor { fill: #fca5a5; }
    .button { fill: #c084fc; }
    .dimline { stroke: #0f766e; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
    .helper { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 5 L 10 0 L 10 10 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <text x="40" y="50" class="title">MiniPal 结构布局草图</text>

  <text x="60" y="95" class="label">顶视图</text>
  <rect x="60" y="120" width="400" height="320" rx="34" ry="34" class="outline"/>

  <rect x="210" y="145" width="100" height="34" rx="8" ry="8" class="module sensor"/>
  <text x="192" y="170" class="label">HC-SR04 前脸区</text>

  <rect x="175" y="205" width="170" height="82" rx="10" ry="10" class="module servo"/>
  <text x="210" y="255" class="label">SG90 舵机区</text>

  <rect x="145" y="305" width="230" height="82" rx="10" ry="10" class="module board"/>
  <text x="208" y="352" class="label">ESP32 主板区</text>

  <rect x="155" y="392" width="210" height="30" rx="8" ry="8" class="module battery"/>
  <text x="198" y="412" class="label">5V 电源 / 电池托盘</text>

  <circle cx="260" cy="118" r="18" class="module button"/>
  <text x="242" y="123" class="note">按钮</text>

  <line x1="60" y1="470" x2="460" y2="470" class="dimline"/>
  <text x="225" y="500" class="dim">100 mm</text>

  <line x1="490" y1="120" x2="490" y2="440" class="dimline"/>
  <text x="510" y="290" class="dim">90 mm</text>

  <text x="100" y="545" class="note">布局思路：前脸传感器，上层舵机，中层主板，下层电源，整体重心向下。</text>

  <text x="620" y="95" class="label">侧视图</text>
  <rect x="620" y="120" width="360" height="320" rx="24" ry="24" class="outline"/>

  <rect x="765" y="165" width="90" height="48" rx="10" ry="10" class="module servo"/>
  <text x="736" y="196" class="label">舵机上层</text>

  <rect x="650" y="245" width="94" height="50" rx="10" ry="10" class="module sensor"/>
  <text x="635" y="277" class="label">前脸传感器</text>

  <rect x="735" y="285" width="150" height="62" rx="10" ry="10" class="module board"/>
  <text x="772" y="322" class="label">ESP32 主板</text>

  <rect x="715" y="360" width="190" height="46" rx="10" ry="10" class="module battery"/>
  <text x="760" y="389" class="label">电源托盘</text>

  <line x1="620" y1="470" x2="980" y2="470" class="dimline"/>
  <text x="780" y="500" class="dim">90 mm</text>

  <line x1="1010" y1="120" x2="1010" y2="440" class="dimline"/>
  <text x="1030" y="290" class="dim">70 mm</text>

  <text x="60" y="610" class="label">正视图</text>
  <rect x="60" y="630" width="400" height="90" rx="20" ry="20" class="outline"/>
  <circle cx="190" cy="675" r="24" class="module sensor"/>
  <circle cx="330" cy="675" r="24" class="module sensor"/>
  <text x="122" y="707" class="note">双探头可直接作为“眼睛”，强化桌宠观感。</text>

  <text x="620" y="560" class="note">壁厚建议 3 mm；舵机固定区局部加厚；传感器窗口上方避免过长桥接。</text>
  <text x="620" y="590" class="note">建议打印方向：底面朝下，必要时仅在传感器窗口区域添加支撑。</text>
</svg>
